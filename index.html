  <script>
const {
  useState,

const FB_URL = "https://www.facebook.com/HighConvertingStaticimages";

/* ─── BRAND COLORS (from logo) ──────────────────────────────────────────── */
// Navy blue: #1B3A8C  Red accent: #E8192C  Purple-pink gradient on icon
// Background: white / very light lavender

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap');

:root {
  --navy:   #1B3A8C;
  --red:    #E8192C;
  --purple: #7B3FF5;
  --pink:   #D946EF;
  --grad-icon: linear-gradient(135deg, #7B3FF5, #D946EF);
  --grad-btn:  linear-gradient(135deg, #1B3A8C, #3B5EC6);
  --light-bg:  #F0F2FF;
  --gray:      #F7F8FC;
  --border:    #E4E8F4;
  --body:      #1A2235;
  --muted:     #64748B;
  --white:     #ffffff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--white); color: var(--body); overflow-x: hidden; line-height: 1.6; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }

/* ── LOGO SVG inline ── */
.brand-logo {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
}
.brand-logo-icon {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--grad-icon);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-logo-text { line-height: 1.1; }
.brand-logo-text .t1 { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .82rem; color: var(--navy); display: block; }
.brand-logo-text .t2 { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: .72rem; color: var(--muted); display: block; }

/* ── NAV ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 60px; transition: all .3s;
}
.nav.scrolled {
  background: rgba(255,255,255,.97); backdrop-filter: blur(16px);
  box-shadow: 0 1px 0 var(--border), 0 4px 20px rgba(27,58,140,.07);
}
.nav-links { display: none; gap: 1.5rem; align-items: center; }
.nav-links a { font-size: .82rem; font-weight: 600; color: var(--body); transition: color .2s; cursor: pointer; }
.nav-links a:hover, .nav-links a.active { color: var(--navy); }
.nav-cta-btn {
  background: var(--grad-btn); color: #fff !important;
  padding: 8px 18px; border-radius: 100px; font-size: .8rem !important; font-weight: 700 !important;
}
.hb { display: flex; flex-direction: column; gap: 5px; background: none; border: none; padding: 4px; }
.hb span { display: block; width: 22px; height: 2px; background: var(--navy); border-radius: 2px; transition: all .3s; }
.hb.open span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
.hb.open span:nth-child(2) { opacity: 0; }
.hb.open span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }
.drawer {
  position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
  background: #fff; z-index: 999; padding: 1.5rem 24px;
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .35s cubic-bezier(.4,0,.2,1);
}
.drawer.open { transform: translateX(0); }
.drawer a { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; font-weight: 700; font-size: 1rem; border-bottom: 1px solid var(--border); cursor: pointer; color: var(--body); }
.drawer-cta { margin-top: auto; background: var(--grad-btn); color: #fff !important; padding: 16px !important; border-radius: 14px; text-align: center; justify-content: center !important; border-bottom: none !important; }

/* ── FLOAT ── */
.float-fb {
  position: fixed; bottom: 20px; right: 20px; z-index: 900;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--grad-btn); display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(27,58,140,.38); transition: transform .2s, box-shadow .2s;
}
.float-fb:hover { transform: scale(1.1); }

/* ── HERO ── */
.hero {
  min-height: 100svh; display: flex; flex-direction: column; justify-content: flex-end;
  padding: 80px 24px 52px; position: relative; overflow: hidden;
  background: linear-gradient(160deg, #EEF0FF 0%, #F8F0FF 50%, #FFF0F8 100%);
}
.hero-orb { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(60px); }
.hero-logo-big {
  display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 2rem;
  position: relative; z-index: 2;
}
.hero-logo-icon {
  width: 72px; height: 72px; border-radius: 18px; background: var(--grad-icon);
  display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
  box-shadow: 0 8px 32px rgba(123,63,245,.28);
}
.hero h1 {
  font-family: 'Nunito', sans-serif; font-weight: 900;
  font-size: clamp(2rem, 7vw, 3.6rem); color: var(--navy); line-height: 1.1;
  margin-bottom: 1rem; position: relative; z-index: 2;
}
.hero h1 span { color: var(--red); }
.hero p {
  font-size: clamp(.9rem, 2.5vw, 1rem); color: var(--muted); line-height: 1.8;
  margin-bottom: 2rem; max-width: 500px; position: relative; z-index: 2;
}
.hero-btns { display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 2; }
.btn-navy {
  background: var(--grad-btn); color: #fff; font-weight: 800; padding: 15px 24px;
  border-radius: 12px; border: none; font-size: .92rem; font-family: inherit;
  transition: transform .2s, box-shadow .2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn-navy:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(27,58,140,.3); }
.btn-outline {
  background: transparent; color: var(--navy); font-weight: 700; padding: 15px 24px;
  border-radius: 12px; border: 2px solid var(--navy); font-size: .92rem; font-family: inherit;
  transition: background .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  text-decoration: none;
}
.btn-outline:hover { background: rgba(27,58,140,.06); }

/* ── TRUST STRIP ── */
.trust { background: var(--navy); padding: 22px 24px; }
.trust-inner { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; max-width: 900px; margin: 0 auto; }
.trust-item { display: flex; align-items: center; gap: 10px; }
.trust-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
.trust-num { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.1rem; color: #fff; line-height: 1; }
.trust-lbl { font-size: .7rem; color: rgba(255,255,255,.6); font-weight: 500; }

/* ── SECTIONS ── */
.sec { padding: 60px 24px; }
.sec-light { background: var(--light-bg); }
.sec-gray  { background: var(--gray); }
.slbl { font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--purple); margin-bottom: 8px; }
.stitle { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: clamp(1.6rem,5vw,2.5rem); color: var(--navy); line-height: 1.15; }
.ssub { color: var(--muted); font-size: .88rem; line-height: 1.75; margin-top: 8px; max-width: 520px; }
.shdr { margin-bottom: 2rem; }
.shdr.c { text-align: center; }
.shdr.c .ssub { margin-left: auto; margin-right: auto; }

/* ══════════════════════════
   SERVICE CARDS — CLICK TO EXPAND
══════════════════════════ */
.svc-main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.svc-main-card {
  border: 2px solid var(--border); border-radius: 18px; padding: 20px 16px;
  background: #fff; cursor: pointer; transition: all .25s; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.svc-main-card:hover { border-color: var(--navy); box-shadow: 0 4px 20px rgba(27,58,140,.1); transform: translateY(-2px); }
.svc-main-card.active { border-color: var(--navy); background: var(--light-bg); box-shadow: 0 4px 24px rgba(27,58,140,.12); }
.svc-main-icon { font-size: 2.2rem; }
.svc-main-name { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .92rem; color: var(--navy); line-height: 1.3; }
.svc-main-sub { font-size: .72rem; color: var(--muted); line-height: 1.4; }
.svc-main-from { background: var(--red); color: #fff; font-size: .65rem; font-weight: 800; padding: 2px 10px; border-radius: 100px; }
.svc-main-card.active .svc-main-from { background: var(--navy); }

/* EXPANDED PANEL */
.svc-expand {
  border: 2px solid var(--navy); border-radius: 18px; background: #fff;
  margin-top: 4px; overflow: hidden;
  animation: slideDown .3s ease;
}
@keyframes slideDown { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform: translateY(0); } }
.svc-expand-header {
  background: var(--navy); padding: 16px 18px;
  display: flex; align-items: center; justify-content: space-between;
}
.svc-expand-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1rem; color: #fff; }
.svc-expand-close { background: rgba(255,255,255,.15); border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; font-size: 1rem; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; }

/* AD CREATIVE PACKAGES inside expand */
.pkg-grid { display: flex; gap: 10px; overflow-x: auto; padding: 18px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.pkg-grid::-webkit-scrollbar { display: none; }
.pkg-mini {
  flex-shrink: 0; min-width: 165px; border: 2px solid var(--border); border-radius: 14px;
  padding: 16px 14px; background: #fff; position: relative; display: flex; flex-direction: column;
  transition: border-color .2s;
}
.pkg-mini.featured { border-color: var(--navy); }
.pkg-mini-badge {
  position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
  background: var(--red); color: #fff; font-size: .62rem; font-weight: 800; padding: 3px 12px; border-radius: 100px; white-space: nowrap;
}
.pkg-mini-name { font-size: .68rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.pkg-mini-price { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.7rem; color: var(--navy); line-height: 1; margin-bottom: 3px; }
.pkg-mini-tag { font-size: .7rem; color: var(--purple); font-weight: 700; margin-bottom: 10px; }
.pkg-mini-div { height: 1px; background: var(--border); margin-bottom: 10px; }
.pkg-mini-feat { font-size: .75rem; color: var(--body); padding: 4px 0; border-bottom: 1px solid #F1F3F8; display: flex; align-items: flex-start; gap: 6px; }
.pkg-mini-feat:last-child { border-bottom: none; }
.pchk { color: var(--navy); font-weight: 900; font-size: .78rem; flex-shrink: 0; margin-top: 1px; }
.pkg-mini-cta { margin-top: 12px; width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: 800; font-size: .78rem; background: var(--grad-btn); color: #fff; text-align: center; display: block; text-decoration: none; transition: opacity .2s; }
.pkg-mini-cta:hover { opacity: .88; }

/* OTHER SERVICE tier card inside expand */
.ods-inner { padding: 18px; }
.ods-desc-text { font-size: .84rem; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }
.tier-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
.tier-card { border: 2px solid var(--border); border-radius: 12px; padding: 14px 10px; text-align: center; transition: all .2s; }
.tier-card.best { border-color: var(--navy); background: var(--light-bg); }
.tier-lbl { font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 7px; display: inline-block; padding: 2px 10px; border-radius: 100px; }
.tier-price { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.35rem; color: var(--navy); line-height: 1; margin-bottom: 5px; }
.tier-inc { font-size: .7rem; color: var(--muted); line-height: 1.4; }
.tier-na { font-size: .7rem; color: #CBD5E1; font-style: italic; }
.ods-cta-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ods-cta-note { font-size: .75rem; color: var(--muted); flex: 1; min-width: 120px; }

/* CATEGORY FILTER PORTFOLIO */
.cat-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 1.2rem; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-pill { flex-shrink: 0; padding: 7px 15px; border-radius: 100px; border: 1.5px solid var(--border); background: #fff; font-size: .78rem; font-weight: 700; color: var(--body); cursor: pointer; transition: all .2s; white-space: nowrap; }
.cat-pill.active, .cat-pill:hover { background: var(--navy); color: #fff; border-color: var(--navy); }

/* PORTFOLIO GRID */
.pgrid { columns: 2; column-gap: 10px; }
.pitem { break-inside: avoid; margin-bottom: 10px; border-radius: 14px; overflow: hidden; cursor: pointer; position: relative; display: block; }
.pover { position: absolute; inset: 0; background: linear-gradient(to top, rgba(27,58,140,.88) 0%, transparent 55%); padding: 10px; display: flex; flex-direction: column; justify-content: flex-end; opacity: 0; transition: opacity .25s; }
.pitem:hover .pover, .pitem:active .pover { opacity: 1; }
.from-tag { position: absolute; top: 8px; right: 8px; background: var(--red); color: #fff; font-size: .6rem; font-weight: 800; padding: 3px 9px; border-radius: 100px; }

/* TESTIMONIALS */
.tscroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tscroll::-webkit-scrollbar { display: none; }
.tcard { flex-shrink: 0; width: 270px; background: #fff; border-radius: 16px; padding: 18px; border: 1.5px solid var(--border); }
.tstars { color: var(--red); font-size: .85rem; margin-bottom: 8px; }
.ttext { font-size: .84rem; color: var(--body); line-height: 1.7; margin-bottom: 12px; font-style: italic; }
.tauthor { display: flex; align-items: center; gap: 10px; }
.tavatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; background: var(--grad-btn); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: .85rem; }
.tname { font-weight: 700; font-size: .78rem; color: var(--navy); }
.tbiz { font-size: .68rem; color: var(--muted); }

/* FAQ */
.faq-item { border-bottom: 1.5px solid var(--border); }
.faq-q { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; background: none; border: none; font-size: .86rem; font-weight: 700; color: var(--navy); text-align: left; gap: 12px; font-family: inherit; }
.faq-icon { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--light-bg); display: flex; align-items: center; justify-content: center; color: var(--navy); font-weight: 900; transition: transform .3s; font-size: .85rem; }
.faq-icon.open { transform: rotate(45deg); }
.faq-a { padding: 0 0 14px; font-size: .82rem; color: var(--muted); line-height: 1.75; }

/* CTA BANNER */
.cta-ban { background: var(--navy); padding: 56px 24px; text-align: center; }
.cta-ban h2 { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: clamp(1.5rem,6vw,2.4rem); color: #fff; line-height: 1.2; margin-bottom: 10px; }
.cta-ban p { color: rgba(255,255,255,.65); font-size: .9rem; margin-bottom: 22px; }
.btn-red { background: var(--red); color: #fff; font-weight: 800; padding: 15px 28px; border-radius: 12px; border: none; font-size: .95rem; font-family: inherit; transition: transform .2s, box-shadow .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.btn-red:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(232,25,44,.4); }

/* FOOTER */
.footer { background: #0D1E4A; color: rgba(255,255,255,.5); padding: 44px 24px 28px; }
.footer-logo-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.footer-logo-icon { width: 28px; height: 28px; border-radius: 7px; background: var(--grad-icon); display: flex; align-items: center; justify-content: center; }
.footer-logo-name { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: .9rem; color: #fff; }
.footer-desc { font-size: .78rem; line-height: 1.7; margin-bottom: 22px; }
.footer-links { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 22px; }
.fl-link { font-size: .78rem; color: rgba(255,255,255,.45); cursor: pointer; transition: color .2s; padding: 3px 0; }
.fl-link:hover { color: var(--red); }
.footer-bot { border-top: 1px solid rgba(255,255,255,.08); padding-top: 16px; font-size: .7rem; text-align: center; }

/* CONTACT */
.fg { margin-bottom: 14px; }
.fl { display: block; font-size: .78rem; font-weight: 700; color: var(--navy); margin-bottom: 5px; }
.fi { width: 100%; padding: 12px 14px; border-radius: 11px; border: 1.5px solid var(--border); font-size: .86rem; font-family: inherit; background: #fff; color: var(--body); outline: none; transition: border-color .2s; }
.fi:focus { border-color: var(--navy); }
textarea.fi { resize: vertical; min-height: 100px; }

/* PRICE TABLE */
.ptable { width: 100%; border-collapse: collapse; font-size: .78rem; min-width: 440px; }
.ptable th { background: var(--navy); color: #fff; padding: 11px 12px; text-align: left; font-weight: 800; font-size: .72rem; letter-spacing: .04em; }
.ptable td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--body); }
.ptable tr:nth-child(even) td { background: var(--gray); }
.ptable .na { color: #CBD5E1; font-style: italic; }

/* DESKTOP */
@media(min-width: 768px) {
  .nav { padding: 0 5%; height: 68px; }
  .hb { display: none; }
  .nav-links { display: flex; }
  .drawer { display: none !important; }
  .hero { padding: 100px 5% 80px; }
  .hero-btns { flex-direction: row; }
  .sec { padding: 84px 5%; }
  .trust-inner { grid-template-columns: repeat(5,1fr); }
  .svc-main-grid { grid-template-columns: repeat(4,1fr); }
  .pgrid { columns: 3; }
  .tier-grid { gap: 14px; }
}
@media(min-width: 1024px) { .pgrid { columns: 4; } }

/* ANIM */
@keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
.anim { opacity: 0; animation: fadeUp .5s ease forwards; }
.a1{animation-delay:.08s}.a2{animation-delay:.18s}.a3{animation-delay:.28s}.a4{animation-delay:.38s}
.pe { animation: fadeUp .35s ease forwards; }
`;
